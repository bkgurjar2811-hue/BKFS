name: Build BKFS APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK signature and bundled app
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep 'assets/index.html'
          unzip -l "$APK" | grep 'assets/app.js'
          mkdir -p output
          cp "$APK" output/BKFS-demo.apk
          sha256sum output/BKFS-demo.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BKFS-Android-APK
          path: output/
          if-no-files-found: error
          retention-days: 90
