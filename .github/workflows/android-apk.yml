name: Build BKFS Final Setup APK
on:
  push:
    branches: [android-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint final setup client
        run: gradle -p android-live --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK
        run: |
          APK=android-live/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK"
          mkdir -p output
          cp "$APK" output/BKFS-final-setup-1.2.apk
          cp android-live/README_BUILD_APK.txt output/README.txt
          sha256sum output/BKFS-final-setup-1.2.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BKFS-Final-Setup-APK
          path: output/
          if-no-files-found: error
          retention-days: 90
