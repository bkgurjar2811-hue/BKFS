plugins { id 'com.android.application' }
android {
    namespace 'in.bkfs.demo'
    compileSdk 35
    defaultConfig {
        applicationId 'in.bkfs.demo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-demo'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/webAssets')
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.register('copyWebAssets', Copy) {
    from('../..') {
        include 'index.html', 'app.js', 'styles.css', 'icon.svg', 'manifest.webmanifest'
    }
    into layout.buildDirectory.dir('generated/webAssets')
}
tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
