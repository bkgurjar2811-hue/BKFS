plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bkfs.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.bkfs.app"
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName "1.5-sync"
    }
}

// Keep the old bundled screen only as a first-install fallback. Once the owner
// opens /app online, the exact live UI and state are cached for offline use.
tasks.register('prepareOfflineAssets', Copy) {
    def repoRoot = rootProject.projectDir.parentFile
    from(repoRoot) {
        include 'index.html', 'app.js', 'styles.css', 'icon.svg', 'manifest.webmanifest', 'sw.js'
    }
    into layout.projectDirectory.dir('src/main/assets/offline')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareOfflineAssets')
}

dependencies {
}
