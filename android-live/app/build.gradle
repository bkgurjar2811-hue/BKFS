plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bkfs.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.bkfs.app"
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName "1.4"
    }
}

// Bundle the browser management app inside the APK so the app remains usable
// when Railway/the internet is unavailable. Online mode still opens bkfs-fresh.
tasks.register('prepareOfflineAssets', Copy) {
    def repoRoot = rootProject.projectDir.parentFile
    from(repoRoot) {
        include 'index.html', 'app.js', 'styles.css', 'icon.svg', 'manifest.webmanifest', 'sw.js'
    }
    into layout.projectDirectory.dir('src/main/assets/offline')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareOfflineAssets')
}

dependencies {
}
